# Empêche la mise en veille du projet Supabase gratuit (après 7 jours sans activité).
# Une petite lecture silencieuse tous les 3 jours, aucune notification pour la famille.
name: Garder Supabase éveillé

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lecture de la table keepalive
        run: |
          set -a; . ./.env.production; set +a
          curl --fail --silent --show-error \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            "$VITE_SUPABASE_URL/rest/v1/keepalive?select=id"
